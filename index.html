<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutiger Aero - Portfolio 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        /* ===== LOGO / JUDUL ===== */
        .logo {
            font-size: 64px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* ===== DESKRIPSI ===== */
        .description {
            color: rgba(255,255,255,0.5);
            font-size: 15px;
            line-height: 1.8;
            max-width: 500px;
            margin: 0 auto 40px;
        }

        /* ===== TOMBOL ===== */
        .btn-enter {
            display: inline-block;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 500;
            color: white;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(0, 212, 255, 0.2);
            letter-spacing: 1px;
        }

        .btn-enter:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 40px rgba(0, 212, 255, 0.3);
        }

        .btn-enter:active {
            transform: scale(0.97);
        }

        /* ===== FITUR ===== */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin-top: 50px;
        }

        .feature-item {
            background: rgba(255,255,255,0.03);
            padding: 20px 10px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .feature-item .icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .feature-item .label {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .logo { font-size: 48px; }
            h1 { font-size: 28px; }
            .subtitle { font-size: 12px; letter-spacing: 3px; }
            .description { font-size: 13px; }
            .btn-enter { padding: 14px 32px; font-size: 16px; }
            .features { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }

        @media (max-width: 400px) {
            h1 { font-size: 22px; }
            .features { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">🏠</div>

        <!-- Judul -->
        <h1>Frutiger Aero</h1>
        <div class="subtitle">Living Room 3D</div>

        <!-- Deskripsi -->
        <p class="description">
            Jelajahi ruangan bergaya Frutiger Aero dalam tampilan 3D interaktif.
            <br>Geser, zoom, dan gunakan WASD untuk bergerak di dalam ruangan.
        </p>

        <!-- Tombol Masuk -->
        <a href="ruang-3d.html" class="btn-enter">🚀 Masuk ke Ruangan 3D</a>

        <!-- Fitur -->
        <div class="features">
            <div class="feature-item">
                <div class="icon">🖱️</div>
                <div class="label">Drag &amp; Rotasi</div>
            </div>
            <div class="feature-item">
                <div class="icon">🤏</div>
                <div class="label">Pinch Zoom</div>
            </div>
            <div class="feature-item">
                <div class="icon">⌨️</div>
                <div class="label">WASD Gerak</div>
            </div>
            <div class="feature-item">
                <div class="icon">📱</div>
                <div class="label">Mobile Support</div>
            </div>
        </div>
    </div>
</body>
</html>
